{% extends "base.html" %}
{% load static %}

{% block title %}Accueil{% endblock %}


{% block content %}
<h1>Demandes d'aides disponibles</h1>

{% if slots_list %}
    <ul>
{% for slot in slots_list %}
<li>
    {{ slot }}
    <a href="{% url 'competences:purpose_help' slot.id %}">Proposer</a>
</li>
{% endfor %}
    </ul>
{% else %}
    <p>Aucun résultat trouvé.</p>
{% endif %}
{% endblock %}
