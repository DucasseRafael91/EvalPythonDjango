{% extends "base.html" %}

{% load static %}

{% block title %}Accueil{% endblock %}

{% block content %}
        {% if slots_list %}
    <ul>
    {% for slot in slots_list %}
        <li><a href="#">{{ slot.activity }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No Slots are available.</p>
{% endif %}
{% endblock %}
